[package]
name = "nutrisurvey"
version = "0.1.0"
description = "NutriSurvey native application"
authors = ["NutriSurvey contributors"]
edition = "2021"

[lib]
name = "nutrisurvey_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
doctest = false

[build-dependencies]
tauri-build = { version = "2.4.1", features = [] }
dotenvy = "0.15"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1"
sha2 = "0.10"
keyring = { version = "3", features = ["linux-native-sync-persistent", "windows-native", "apple-native"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
futures-util = "0.3"
thiserror = "2"
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio", "macros"] }
tauri = { version = "2.11.5", features = [] }
tauri-plugin-dialog = "2.7.0"
tauri-plugin-fs = "2.5.0"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
