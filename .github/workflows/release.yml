name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: '--bundles appimage,deb'
          - platform: windows-latest
            args: '--bundles nsis,msi'
          - platform: macos-14
            args: '--target universal-apple-darwin --bundles dmg'

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install system deps (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev pkg-config libdbus-1-dev libsecret-1-dev libfuse2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-14' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend deps
        run: npm ci

      - name: Write .env for build-time AI config
        shell: bash
        run: |
          if [ -n "$AI_API_KEY" ] || [ -n "$AI_MODEL" ]; then
            echo "AI_API_KEY=$AI_API_KEY" > .env
            echo "AI_MODEL=$AI_MODEL" >> .env
            echo "AI_BASE_URL=$AI_BASE_URL" >> .env
            echo "AI_PROVIDER=$AI_PROVIDER" >> .env
          fi
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
          AI_BASE_URL: ${{ secrets.AI_BASE_URL }}
          AI_PROVIDER: ${{ secrets.AI_PROVIDER }}

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # AppImage tooling (linuxdeploy/appimagetool) di runner tanpa FUSE.
          APPIMAGE_EXTRACT_AND_RUN: '1'
          NO_STRIP: 'true'
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
          AI_BASE_URL: ${{ secrets.AI_BASE_URL }}
          AI_PROVIDER: ${{ secrets.AI_PROVIDER }}
        with:
          tauriScript: npx tauri
          tagName: ${{ github.ref_name }}
          releaseName: "NutriSurvey ${{ github.ref_name }}"
          releaseBody: |
            ## NutriSurvey ${{ github.ref_name }}

            Download installer sesuai OS:
            - **Linux**: `.AppImage` atau `.deb`
            - **Windows**: `.exe` (NSIS) atau `.msi`
            - **macOS**: `.dmg`

            ### Apa yang baru di v2.2.0
            - **Interpretasi IMT Asia Pasifik** kini sesuai materi MNT: Underweight / Normal / Beresiko / Obes I / Obes II.
            - **Penentuan BB untuk perhitungan energi**: BB aktual (malnutrisi–normal), BBI (overweight & obes I), BB adjusted (obes II ke atas); rumus BBI & BB adjusted sesuai slide (pria ≥160 cm / wanita ≥150 cm).
            - **Satu file konfigurasi** `src/lib/app-config.ts` untuk versi dan bahasa aplikasi — ubah sekali, semua label & nomor versi ikut berubah (`npm run sync:version` menyinkronkan package.json → tauri.conf.json + Cargo.toml).
            - **UI khusus layar landscape/HP di APK**: sidebar menjadi bilah atas ringkas, konten penuh lebar, kontrol lebih besar.
            - Ekspor laporan PDF/DOCX/RTF (Times New Roman, A4, halaman hitungan diet terpisah) dan database 10.000+ pangan tetap tersedia.

            App akan mendeteksi update otomatis dari release berikutnya.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
