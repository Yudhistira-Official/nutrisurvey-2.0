name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''
          - platform: macos-latest
            args: '--target universal-apple-darwin'

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install system deps (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev pkg-config libdbus-1-dev libsecret-1-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend deps
        run: npm ci

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
          AI_BASE_URL: ${{ secrets.AI_BASE_URL }}
          AI_PROVIDER: ${{ secrets.AI_PROVIDER }}
        with:
          tauriScript: npm run tauri:build
          tagName: ${{ github.ref_name }}
          releaseName: "NutriSurvey ${{ github.ref_name }} — Major Update"
          releaseBody: |
            ## Major Update — NutriSurvey ${{ github.ref_name }}

            Download installer sesuai OS:
            - **Linux**: `.AppImage` atau `.deb`
            - **Windows**: `.exe` (NSIS) atau `.msi`
            - **macOS**: `.dmg`

            ### Apa yang baru di v2.0.0
            - Tampilan tab Rekomendasi diperbarui — dropdown style konsisten
            - Pop-up donasi QRIS saat pertama buka aplikasi
            - Animasi slide-up/down pada popup donasi
            - Perbaikan UI dan performa lainnya

            App akan mendeteksi update otomatis dari release berikutnya.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
