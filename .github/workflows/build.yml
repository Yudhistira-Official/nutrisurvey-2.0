name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  RUST_BACKTRACE: 1

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml

  desktop:
    name: Desktop ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            args: ''
          - os: windows-latest
            args: ''
          - os: macos-latest
            args: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run tauri:build -- ${{ matrix.args }}
      - name: Upload unsigned bundles
        if: ${{ !secrets.TAURI_SIGNING_PRIVATE_KEY }}
        uses: actions/upload-artifact@v4
        with:
          name: nutrisurvey-${{ matrix.os }}-unsigned
          path: src-tauri/target/release/bundle
          if-no-files-found: error

  mobile:
    name: Mobile ${{ matrix.target }} compile
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [android]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - run: npx tauri ${{ matrix.target }} init --ci
      - run: npx tauri ${{ matrix.target }} build
        env:
          NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
      - name: Upload unsigned mobile bundles
        if: ${{ !secrets.ANDROID_KEYSTORE_PASSWORD }}
        uses: actions/upload-artifact@v4
        with:
          name: nutrisurvey-${{ matrix.target }}-unsigned
          path: src-tauri/gen/${{ matrix.target }}/app/build/outputs
          if-no-files-found: warn

  ios-check:
    name: iOS configuration check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npx tauri ios init --ci
      - run: npx tauri ios build --debug
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_PROVISIONING_PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE }}
