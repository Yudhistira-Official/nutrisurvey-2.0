name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  RUST_BACKTRACE: 1

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml

  desktop:
    name: Desktop ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            args: ''
          - os: windows-latest
            args: ''
          - os: macos-latest
            args: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run build
      - run: npm run tauri:build -- ${{ matrix.args }}
      - name: Upload unsigned bundles
        if: ${{ !secrets.TAURI_SIGNING_PRIVATE_KEY }}
        uses: actions/upload-artifact@v4
        with:
          name: nutrisurvey-${{ matrix.os }}-unsigned
          path: src-tauri/target/release/bundle
          if-no-files-found: error

  mobile:
    name: Mobile ${{ matrix.target }} compile
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [android]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0 ndk;27.2.12479018'
      - uses: android-actions/setup-ndk@v3
        id: setup-ndk
        with:
          ndk-version: 27.2.12479018
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, i686-linux-android, x86_64-linux-android
      - run: npm ci
      - run: npm run build
      - run: npx tauri android init --ci
      - run: rustup target list --installed
      - run: npx tauri android build --ci
        env:
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
      - name: Upload unsigned mobile bundles
        if: ${{ !secrets.ANDROID_KEYSTORE_PASSWORD }}
        uses: actions/upload-artifact@v4
        with:
          name: nutrisurvey-${{ matrix.target }}-unsigned
          path: src-tauri/gen/${{ matrix.target }}/app/build/outputs
          if-no-files-found: warn

  ios-check:
    name: iOS configuration check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npx tauri ios init --ci
      - run: npx tauri ios build --debug
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_PROVISIONING_PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE }}
